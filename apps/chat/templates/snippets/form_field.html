{% if field.errors %}
{% for error in field.errors %}
<div role="alert" class="mb-2 alert alert-error">
  <div class="text-sm">{{ error }}</div>
</div>
{% endfor %}
{% endif %}
{% if field.field.widget.input_type == 'checkbox' %}
<div class="form-control">
  <label class="label cursor-pointer justify-start gap-3" for="{{ field.id_for_label }}">
    <input
      type="checkbox"
      name="{{ field.html_name }}"
      id="{{ field.id_for_label }}"
      class="checkbox checkbox-sm"
      {% if field.value %}checked{% endif %}
      {% if field.field.required %}required{% endif %}
    >
    <span class="label-text">{{ field.label }}</span>
  </label>
</div>
{% else %}
<div class="form-control">
  <label class="label" for="{{ field.id_for_label }}">
    <span class="label-text">{{ field.label }}</span>
  </label>
  <input
    type="{{ field.field.widget.input_type }}"
    name="{{ field.html_name }}"
    id="{{ field.id_for_label }}"
    value="{{ field.value|default_if_none:'' }}"
    class="w-full px-4 py-2 border border-base-300 rounded-md focus:ring-2 focus:ring-primary focus:outline-none text-sm"
    {% if field.field.required %}required{% endif %}
  >
</div>
{% endif %}

<div class="card bg-base-100 shadow-sm m-3">
    <div class="card-body">
        <div class="card-actions justify-end">
            <h2 class="card-title mr-auto">Add Organisation</h2>
        </div>
        <form method="post" hx-target="#inner-content" class="space-y-4 w-full">
            {% csrf_token %}
            {% for field in form.visible_fields %}
            <div>
                {% include "snippets/form_field.html" %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-outline-primary" hx-get="{% url 'users:user_organisation' %}" hx-target="#inner-content" hx-swap="innerHTML" hx-trigger="click">Cancel</button>
        </form>
    </div>
</div>
